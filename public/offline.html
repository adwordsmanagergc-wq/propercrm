<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No signal — Proper CRM</title>
    <style>
      :root {
        color-scheme: light;
        --blue-500: #0b7f8c;
        --blue-50: #effafb;
        --grey-50: #f4f7f8;
        --grey-200: #e1e7ea;
        --grey-500: #56636c;
        --grey-900: #0d1b22;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--grey-50);
        color: var(--grey-900);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        background: #fff;
        border: 1px solid var(--grey-200);
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(10, 42, 48, 0.06);
        padding: 28px;
        text-align: center;
      }
      h1 {
        font-size: 1.375rem;
        margin: 16px 0 8px;
      }
      p {
        color: var(--grey-500);
        line-height: 1.6;
        margin: 0 0 20px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 3.5rem;
        width: 100%;
        border-radius: 10px;
        background: var(--blue-500);
        color: #fff;
        font-weight: 600;
        font-size: 1.125rem;
        text-decoration: none;
      }
      .badge {
        width: 56px;
        height: 56px;
        margin: 0 auto;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--blue-50);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#0b7f8c"
          stroke-width="1.9"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6.5 18A4.5 4.5 0 0 1 6 9.06 6.5 6.5 0 0 1 17.5 7.4 4.6 4.6 0 0 1 20 16" />
          <path d="m3 3 18 18" />
        </svg>
      </div>
      <h1>No signal</h1>
      <p>
        Your jobs are saved on this phone. Anything you finish now will be sent to the office as
        soon as you get a bar of signal back.
      </p>
      <a href="/app">Back to my day</a>
    </main>
  </body>
</html>
